         to the pre-built single-file app instead of a blank page. */
      if (location.protocol === "file:" && /\/index\.html$/i.test(location.pathname)) {
        /* Only the dev entry redirects — the built file keeps this script but
           never matches this condition, so it cannot redirect to itself. */
        var f = "WACRM-CMS.html";
        document.getElementById("root").innerHTML =
          '<div style="font:15px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;max-width:620px;margin:12vh auto;padding:0 24px;color:#0E1116">' +
          '<div style="font-weight:700;font-size:18px;margin-bottom:10px">This is the development entry file</div>' +
          '<p style="margin:0 0 14px;color:#4A5568">It needs the Vite dev server (<code>npm install</code> then <code>npm run dev</code>). ' +
          'To just look at the dashboard, open the pre-built file:</p>' +
          '<p style="margin:0"><a href="' + f + '" style="display:inline-block;background:#6D4AFF;color:#fff;text-decoration:none;font-weight:600;padding:10px 18px;border-radius:10px">Open ' + f + '</a></p>' +
          '</div>';
        location.replace(f);
      }
    </script>
  </body>
</html>
